<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · RougeChain Store</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080d">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* What the app shows for a page it hasn't saved yet while there's no connection. */
:root { color-scheme: dark; --ink: #07080d; --panel: #10121b; --line: #252839; --text: #f0f4f6; --muted: #9095a8; --crimson: #d5243e; --violet: #692f96;
  --display: "Rajdhani", "Arial Narrow", sans-serif; --body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink); background-image: linear-gradient(135deg, rgba(213, 36, 62, .13) 0%, transparent 34%), linear-gradient(315deg, rgba(105, 47, 150, .16) 0%, transparent 38%);
  color: var(--text); font: 400 15px/1.55 var(--body); }
main { width: min(440px, 100%); display: grid; gap: 14px; justify-items: start; }
img { width: 44px; height: 44px; }
h1 { margin: 4px 0 0; font: 700 30px/1.05 var(--display); letter-spacing: .06em; text-transform: uppercase; }
p { margin: 0; color: #c9cedd; }
button { margin-top: 6px; border: 0; padding: 12px 18px; font: 700 15px/1 var(--display); letter-spacing: .07em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--crimson), var(--violet)); border-radius: 2px; cursor: pointer; touch-action: manipulation; }
a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="img/rougechain.png" alt="">
  <h1>You're offline</h1>
  <p>This page needs a connection the first time. Pages you've already opened still work.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <a href="index.html">Go to the store</a>
</main>
</body>
</html>
