<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you · RougeChain Store</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Where Stripe sends a buyer after paying (the Payment Link's confirmation redirect). */
:root {
  color-scheme: dark;
  --ink: #07080d; --panel: #10121b; --panel-hi: #171a27; --line: #252839;
  --text: #f0f4f6; --muted: #9095a8; --crimson: #d5243e; --violet: #692f96; --amber: #ffb648;
  --display: "Rajdhani", "Arial Narrow", sans-serif;
  --body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, "Consolas", monospace;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--ink); background-image: linear-gradient(135deg, rgba(213, 36, 62, .13) 0%, transparent 34%), linear-gradient(315deg, rgba(105, 47, 150, .16) 0%, transparent 38%); color: var(--text); font: 400 15px/1.55 var(--body); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px; }
[hidden] { display: none !important; }
a { color: inherit; }
.card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); padding: 28px 26px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 15px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
.brand img { width: 28px; height: 28px; }
.brand b { color: var(--crimson); }
h1 { margin: 6px 0 0; font: 700 34px/1.05 var(--display); letter-spacing: .06em; text-transform: uppercase; }
p { margin: 0; color: #c9cedd; }
.small { font-size: 13px; color: var(--muted); }
.go { justify-self: start; display: inline-flex; padding: 11px 16px; font: 700 15px/1 var(--display); letter-spacing: .07em; text-transform: uppercase; text-decoration: none; color: #fff; background: linear-gradient(135deg, var(--crimson), var(--violet)); border-radius: 2px; }
.go:focus-visible, a:focus-visible { outline: 2px solid #9b5bd0; outline-offset: 2px; }
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="index.html"><img src="img/rougechain.png" alt=""><span><b>ROUGECHAIN</b> STORE</span></a>
  <h1>Thank you</h1>
  <p>Your payment went through. Stripe has emailed your receipt, and your Gltch Runner Early Access download will be sent to the same address.</p>
  <p class="small" data-contact></p>
  <a class="go" href="index.html">Back to the store</a>
</main>
<script src="store-config.js"></script>
<script src="store.js"></script>
<script>
  // what was paid for is no longer in the cart
  if (window.RC) window.RC.clearCart();
  var c = document.querySelector("[data-contact]");
  if (c && !c.textContent) c.hidden = true;
</script>
</body>
</html>
